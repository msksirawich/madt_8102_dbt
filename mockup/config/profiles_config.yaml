# Profiles Table Mock Data Configuration

table_name: profiles
description: "Extended user profile details (1:1 with users)"

# Number of records to generate (90% of users have profiles)
num_records_ratio: 0.9  # 90% of users

# Output settings
output:
  file_format: csv
  file_name: profiles.csv

# Column definitions
columns:
  profile_id:
    type: sequence
    start: 1
    description: "Primary key"

  user_id:
    type: foreign_key
    reference_table: users
    reference_column: user_id
    unique: true  # 1:1 relationship
    description: "Foreign key to users table (1:1)"

  headline:
    type: faker
    provider: job
    description: "Short professional headline (e.g., 'Senior Data Scientist')"

  summary:
    type: faker
    provider: text
    max_nb_chars: 500
    description: "Professional summary/bio"

  current_salary:
    type: faker
    provider: random_int
    min: 40000
    max: 250000
    description: "Current salary in USD"

  willing_to_relocate:
    type: faker
    provider: boolean
    probability: 0.3  # 30% willing to relocate
    description: "Relocation preference (critical for GNN)"

  created_at:
    type: faker
    provider: date_time_between
    start_date: "2024-01-01"
    end_date: "2025-12-15"
    description: "Profile creation timestamp"

  updated_at:
    type: derived
    source: created_at
    offset_days:
      min: 0
      max: 180
    description: "Last update timestamp"

# Constraints
constraints:
  - one_to_one_with_users: true
  - salary_range: [40000, 250000]

# Dependencies
dependencies:
  - table: users
    column: user_id
