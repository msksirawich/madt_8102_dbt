# Job Skills Table Mock Data Configuration

table_name: job_skills
description: "Many-to-many link between jobs and required skills"

# Number of records (each job requires 3-10 skills)
records_per_job:
  min: 3
  max: 10
  avg: 6

# Output settings
output:
  file_format: csv
  file_name: job_skills.csv

# Column definitions
columns:
  job_id:
    type: foreign_key
    reference_table: job_postings
    reference_column: job_id
    description: "Foreign key to job_postings table"

  skill_id:
    type: foreign_key
    reference_table: skills
    reference_column: skill_id
    description: "Foreign key to skills table"

  importance:
    type: faker
    provider: random_int
    min: 1
    max: 5
    description: "Skill importance level (1-5 scale)"

  created_at:
    type: faker
    provider: date_time_between
    start_date: "2024-01-01"
    end_date: "2025-12-15"
    description: "Record creation timestamp"

  updated_at:
    type: derived
    source: created_at
    offset_days:
      min: 0
      max: 30
    description: "Last update timestamp"

# Primary key (composite)
primary_key:
  - job_id
  - skill_id

# Business rules
rules:
  - No duplicate (job_id, skill_id) pairs
  - Each job should have mix of tech skills (60%), soft skills (30%), languages (10%)
  - Important skills (4-5) should be 40% of total
  - Core skills get importance 4-5, nice-to-have get 1-3

# Skill distribution by job title
skill_preferences:
  "Data Scientist":
    required_skills:
      - "Python"
      - "Machine Learning"
      - "SQL"
      - "Statistical Analysis"
    preferred_skills:
      - "TensorFlow"
      - "PyTorch"
      - "Pandas"
      - "Data Warehousing"

  "Software Engineer":
    required_skills:
      - "Programming Language (Python/Java/JavaScript)"
      - "Git"
      - "SQL"
    preferred_skills:
      - "Docker"
      - "REST API"
      - "Testing"

  "DevOps Engineer":
    required_skills:
      - "Docker"
      - "Kubernetes"
      - "AWS/Azure/GCP"
      - "CI/CD"
    preferred_skills:
      - "Terraform"
      - "Linux"
      - "Networking"

# Dependencies
dependencies:
  - table: job_postings
    column: job_id
  - table: skills
    column: skill_id
