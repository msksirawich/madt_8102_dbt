# Education Table Mock Data Configuration

table_name: education
description: "User education history (many-to-one with users)"

# Number of records (each user has 1-3 education entries)
records_per_user:
  min: 1
  max: 3
  avg: 1.5

# Output settings
output:
  file_format: csv
  file_name: education.csv

# Column definitions
columns:
  education_id:
    type: sequence
    start: 1
    description: "Primary key"

  user_id:
    type: foreign_key
    reference_table: users
    reference_column: user_id
    description: "Foreign key to users table"

  degree:
    type: faker
    provider: random_element
    elements:
      - BS
      - MS
      - PhD
      - MBA
      - Associate
    weights: [40, 30, 10, 15, 5]  # Distribution of degrees
    description: "Degree type (BS, MS, PhD, MBA, Associate)"

  school_name:
    type: faker
    provider: random_element
    elements:
      - "Stanford University"
      - "MIT"
      - "UC Berkeley"
      - "Harvard University"
      - "Carnegie Mellon University"
      - "University of Washington"
      - "Georgia Tech"
      - "University of Michigan"
      - "Cornell University"
      - "University of Texas at Austin"
      - "UCLA"
      - "Columbia University"
      - "University of Illinois"
      - "University of Southern California"
      - "Purdue University"
      - "Northwestern University"
      - "Duke University"
      - "Yale University"
      - "Princeton University"
      - "California Institute of Technology"
    description: "University/school name"

  created_at:
    type: faker
    provider: date_time_between
    start_date: "2024-01-01"
    end_date: "2025-12-15"
    description: "Record creation timestamp"

  updated_at:
    type: derived
    source: created_at
    offset_days:
      min: 0
      max: 90
    description: "Last update timestamp"

# Business rules
rules:
  - PhD holders also have MS or BS
  - MS holders also have BS
  - Degree order: BS → MS → PhD/MBA

# Dependencies
dependencies:
  - table: users
    column: user_id
