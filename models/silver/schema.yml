version: 2

models:
  # OLTP Identity & Profile Models
  - name: mst_users
    description: Cleaned and standardized user account data with data quality rules
    columns:
      - name: user_id
        description: Primary key - unique user identifier
        tests:
          - unique
          - not_null
      - name: email
        description: User email address (standardized to lowercase)
        tests:
          - unique
          - not_null
      - name: password_hash
        description: Hashed password for authentication
      - name: is_active
        description: Status flag indicating if account is active
      - name: created_at
        description: Timestamp when user record was created
      - name: updated_at
        description: Timestamp when user record was last updated
      - name: _ingestion_time
        description: When this record landed in the data warehouse
      - name: _ingestion_time
        description: When this record landed in the data warehouse

  - name: mst_profiles
    description: Cleaned and standardized user profile data with data quality rules
    columns:
      - name: profile_id
        description: Primary key
        tests:
          - unique
          - not_null
      - name: user_id
        description: Foreign key to users (1:1 relationship)
        tests:
          - not_null
          - relationships:
              to: ref('mst_users')
              field: user_id
      - name: headline
        description: Short bio/professional headline (trimmed)
      - name: summary
        description: Full bio/professional summary (trimmed)
      - name: current_salary
        description: Used for salary matching features
      - name: willing_to_relocate
        description: Critical GNN feature - relocation preference
      - name: created_at
        description: Timestamp when profile was created
      - name: updated_at
        description: Timestamp when profile was last updated
      - name: _ingestion_time
        description: When this record landed in the data warehouse
      - name: _ingestion_time
        description: When this record landed in the data warehouse

  - name: mst_education
    description: Cleaned and standardized education history with data quality rules
    columns:
      - name: education_id
        description: Primary key
        tests:
          - unique
          - not_null
      - name: user_id
        description: Foreign key to users
        tests:
          - not_null
          - relationships:
              to: ref('mst_users')
              field: user_id
      - name: degree
        description: Degree level (standardized to uppercase - BS, MS, PhD)
      - name: school_name
        description: Name of educational institution (trimmed)
      - name: created_at
        description: Timestamp when record was created
      - name: updated_at
        description: Timestamp when record was last updated
      - name: _ingestion_time
        description: When this record landed in the data warehouse
      - name: _ingestion_time
        description: When this record landed in the data warehouse

  - name: mst_work_history
    description: Cleaned and standardized work experience with computed duration fields
    columns:
      - name: work_id
        description: Primary key
        tests:
          - unique
          - not_null
      - name: user_id
        description: Foreign key to users
        tests:
          - not_null
          - relationships:
              to: ref('mst_users')
              field: user_id
      - name: company_name
        description: Name of company (trimmed)
      - name: title
        description: Job title held (trimmed)
      - name: start_date
        description: Employment start date
      - name: end_date
        description: Employment end date (null if current)
      - name: is_current_position
        description: Computed field - true if end_date is null
      - name: duration_days
        description: Computed field - duration in days (from start_date to end_date or current_date)
      - name: created_at
        description: Timestamp when record was created
      - name: updated_at
        description: Timestamp when record was last updated
      - name: _ingestion_time
        description: When this record landed in the data warehouse
      - name: _ingestion_time
        description: When this record landed in the data warehouse

  - name: mst_user_skills
    description: Cleaned and validated user-skill links with proficiency validation
    columns:
      - name: user_id
        description: Foreign key to users (composite PK)
        tests:
          - not_null
          - relationships:
              to: ref('mst_users')
              field: user_id
      - name: skill_id
        description: Foreign key to skills (composite PK)
        tests:
          - not_null
      - name: proficiency
        description: 1-5 scale proficiency level
        tests:
          - not_null
      - name: created_at
        description: Timestamp when record was created
      - name: updated_at
        description: Timestamp when record was last updated
      - name: _ingestion_time
        description: When this record landed in the data warehouse
      - name: _ingestion_time
        description: When this record landed in the data warehouse

  # OLTP Job Market Models
  - name: mst_companies
    description: Cleaned and standardized company registry data
    columns:
      - name: company_id
        description: Primary key
        tests:
          - unique
          - not_null
      - name: name
        description: Company name (trimmed)
        tests:
          - not_null
      - name: industry
        description: Industry category for matching (trimmed)
      - name: size_range
        description: Company size range (trimmed)
      - name: created_at
        description: Timestamp when record was created
      - name: updated_at
        description: Timestamp when record was last updated
      - name: _ingestion_time
        description: When this record landed in the data warehouse
      - name: _ingestion_time
        description: When this record landed in the data warehouse

  - name: mst_job_postings
    description: Cleaned job postings with computed word count and salary averages
    columns:
      - name: job_id
        description: Primary key
        tests:
          - unique
          - not_null
      - name: company_id
        description: Foreign key to companies
        tests:
          - not_null
          - relationships:
              to: ref('mst_companies')
              field: company_id
      - name: title
        description: Job title (trimmed)
        tests:
          - not_null
      - name: description_html
        description: HTML content with job description
      - name: description_word_count
        description: Computed field - word count from HTML description
      - name: min_salary
        description: Minimum salary for position
      - name: max_salary
        description: Maximum salary for position
      - name: avg_salary
        description: Computed field - average of min and max salary
      - name: status
        description: Job posting status (standardized to lowercase)
        tests:
          - not_null
          - accepted_values:
              values: ['open', 'closed', 'draft']
      - name: published_at
        description: When job was published
      - name: created_at
        description: Timestamp when record was created
      - name: updated_at
        description: Timestamp when record was last updated
      - name: _ingestion_time
        description: When this record landed in the data warehouse
      - name: _ingestion_time
        description: When this record landed in the data warehouse

  - name: mst_skills
    description: Cleaned and standardized skills master list
    columns:
      - name: skill_id
        description: Primary key
        tests:
          - unique
          - not_null
      - name: name
        description: Skill name (trimmed)
        tests:
          - not_null
      - name: category
        description: Skill category (standardized to lowercase)
      - name: created_at
        description: Timestamp when record was created
      - name: updated_at
        description: Timestamp when record was last updated
      - name: _ingestion_time
        description: When this record landed in the data warehouse
      - name: _ingestion_time
        description: When this record landed in the data warehouse

  - name: mst_job_skills
    description: Cleaned and validated job-skill requirement links
    columns:
      - name: job_id
        description: Foreign key to job_postings (composite PK)
        tests:
          - not_null
          - relationships:
              to: ref('mst_job_postings')
              field: job_id
      - name: skill_id
        description: Foreign key to skills (composite PK)
        tests:
          - not_null
          - relationships:
              to: ref('mst_skills')
              field: skill_id
      - name: importance
        description: 1-5 scale importance level
        tests:
          - not_null
      - name: created_at
        description: Timestamp when record was created
      - name: updated_at
        description: Timestamp when record was last updated
      - name: _ingestion_time
        description: When this record landed in the data warehouse
      - name: _ingestion_time
        description: When this record landed in the data warehouse

  # OLTP Transaction Models
  - name: txn_applications
    description: Cleaned and standardized job application records
    columns:
      - name: application_id
        description: Primary key
        tests:
          - unique
          - not_null
      - name: user_id
        description: Foreign key to users
        tests:
          - not_null
          - relationships:
              to: ref('mst_users')
              field: user_id
      - name: job_id
        description: Foreign key to job_postings
        tests:
          - not_null
          - relationships:
              to: ref('mst_job_postings')
              field: job_id
      - name: current_status
        description: Application status (standardized to lowercase)
        tests:
          - not_null
          - accepted_values:
              values: ['applied', 'rejected', 'offer']
      - name: applied_at
        description: Timestamp when application was submitted
        tests:
          - not_null
      - name: created_at
        description: Timestamp when record was created
      - name: updated_at
        description: Timestamp when record was last updated
      - name: _ingestion_time
        description: When this record landed in the data warehouse
      - name: _ingestion_time
        description: When this record landed in the data warehouse

  # Streaming Event Models
  - name: txn_streaming_job_activity
    description: Cleaned streaming events with extracted JSON properties
    columns:
      - name: event_id
        description: UUID for the specific event
        tests:
          - unique
          - not_null
      - name: session_id
        description: Critical for sessionizing data
        tests:
          - not_null
      - name: user_cookie_id
        description: Hashed identifier for user/browser
      - name: job_id
        description: Specific Job Listing ID being interacted with
      - name: event_timestamp
        description: UTC timestamp of when event occurred
        tests:
          - not_null
      - name: event_type
        description: Event category (standardized to uppercase)
        tests:
          - not_null
          - accepted_values:
              values: ['PAGE_VIEW', 'SCROLL', 'CLICK', 'HEARTBEAT']
      - name: event_properties
        description: Dynamic JSON payload based on event_type
      - name: load_time_ms
        description: Extracted property - page load time for PAGE_VIEW events
      - name: scroll_depth_percent
        description: Extracted property - scroll depth percentage for SCROLL events
      - name: max_scroll_px
        description: Extracted property - maximum scroll pixels for SCROLL events
      - name: time_since_load_sec
        description: Extracted property - time since page load for HEARTBEAT events
      - name: is_active
        description: Extracted property - user activity status for HEARTBEAT events
      - name: element_id
        description: Extracted property - clicked element ID for CLICK events
      - name: button_text
        description: Extracted property - button text for CLICK events
      - name: _ingestion_time
        description: When this record landed in the data warehouse
      - name: _ingestion_time
        description: When this record landed in the data warehouse
