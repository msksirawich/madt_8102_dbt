# CSV to DuckDB Pipeline Configuration - Applications

# Pipeline Settings
pipeline:
  name: csv_applications_to_duckdb
  source_type: csv  # Options: postgres, csv

  # Source Configuration
  source:
    file_path: data/applications.csv  # Path to CSV file
    encoding: utf-8
    date_column: created_at  # Column to filter by execution date

  # Target Configuration
  target:
    type: duckdb  # Target type: duckdb
    database_path: data/ingestion.duckdb  # Path to DuckDB database file
    schema: bronze  # Schema name in DuckDB
    table_name: applications  # Table name in DuckDB
    partition_column: dt  # Column used for partitioning (will be added automatically)
    if_exists: overwrite_partition  # Options: append, replace, overwrite_partition
